
stages:
  - deploy

deploy_gitlab:
  image: node:18-bullseye
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE =~ /^(web)|(schedule)$/
  script:
    - echo "@autexis:registry=https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - yarn publish

deploy_npm:
  image: node:18-bullseye
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE =~ /^(web)|(schedule)$/
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_PUBLISH_TOKEN}" >> .npmrc
    - yarn publish
